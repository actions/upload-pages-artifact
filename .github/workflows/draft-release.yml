name: Draft release
on:
  push:
    branches:
      - main

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
